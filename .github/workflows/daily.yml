name: Daily job list

# Twice daily: ~6:00 AM IST and ~3:00 PM IST.
# IST = UTC+5:30, so 6:00 AM IST = 00:30 UTC and 3:00 PM IST = 09:30 UTC.
# GitHub's free scheduler is best-effort and can run 5-30 min late.
# For exact times, use the macOS launchd option in the README.
on:
  schedule:
    - cron: "30 0 * * *"   # ~6:00 AM IST
    - cron: "30 9 * * *"   # ~3:00 PM IST
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write        # lets the workflow commit data/jobs.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-scan.txt
      - name: Scan and email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m job_scanner.main
      - name: Save jobs to repo (for the dashboard)
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Update jobs $(date -u +%F)" || echo "no changes"
          git push
